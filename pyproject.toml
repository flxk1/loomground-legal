# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-legal"
dynamic = ["version"]
description = "The legal domain plane: legal entities, jurisdictional connection algebra (RelationAlgebra-backed), and legal-effect typing bridged into deontic O/P/F + Hohfeld incidents. Data + bridges only — it consumes the family's grammars/engines and grows no reasoning of its own."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Index-resolvable dev deps only; git-pinned unpublished planes live in requirements-dev.txt.
dev = [
    "tomli==2.2.1 ; python_version < '3.11'",
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/flxk1/loomground-legal"
Issues = "https://github.com/flxk1/loomground-legal/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_legal._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loomground_legal = ["artifacts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
